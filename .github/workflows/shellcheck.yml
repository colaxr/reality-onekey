name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and regression checks
        run: |
          bash -n reality.sh install.sh tests/regression.sh
          bash tests/regression.sh
      - name: Run ShellCheck
        run: |
          shellcheck --format=gcc reality.sh install.sh tests/regression.sh > /tmp/shellcheck.txt || result=$?
          while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done < /tmp/shellcheck.txt
          exit "${result:-0}"
