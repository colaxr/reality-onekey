name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  independent-socks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned independent SOCKS5
        run: |
          curl -fL --retry 3 https://github.com/heiher/hev-socks5-server/releases/download/2.13.1/hev-socks5-server-linux-x86_64 -o "$RUNNER_TEMP/hev-socks"
          printf '9707a6d9e6419f6474173affa9d00b25a9ec61c9f320f2d19bb14a0a5a584bc5  %s\n' "$RUNNER_TEMP/hev-socks" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hev-socks"
      - name: Fixed-port authenticated TCP/UDP and concurrent NAT relay tests
        run: python3 tests/independent_socks.py "$RUNNER_TEMP/hev-socks"
      - name: Alpine musl runtime test
        run: |
          docker run --rm -v "$PWD:/work:ro" -v "$RUNNER_TEMP/hev-socks:/hev-socks:ro" -w /work alpine:3.23 sh -c 'apk add --no-cache bash python3 openssl && python3 tests/independent_socks.py /hev-socks'
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and regression checks
        run: |
          bash -n reality.sh install.sh tests/regression.sh tests/permissions.sh
          bash tests/regression.sh
      - name: Real service-user permission checks
        run: sudo bash tests/permissions.sh
      - name: Run ShellCheck
        run: |
          shellcheck --format=gcc reality.sh install.sh tests/regression.sh tests/permissions.sh > /tmp/shellcheck.txt || result=$?
          while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done < /tmp/shellcheck.txt
          exit "${result:-0}"
  socks-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v26.3.27, v26.7.28, v26.9.9]
    steps:
      - uses: actions/checkout@v4
      - name: Download official Xray for loopback integration test
        env:
          XRAY_TEST_VERSION: ${{ matrix.version }}
        run: |
          curl -fL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/${XRAY_TEST_VERSION}/Xray-linux-64.zip" -o "$RUNNER_TEMP/xray-test.zip"
          unzip -oq "$RUNNER_TEMP/xray-test.zip" -d "$RUNNER_TEMP/xray-test"
          chmod +x "$RUNNER_TEMP/xray-test/xray"
      - name: Real SOCKS5 authentication, TCP and UDP
        run: python3 tests/socks_runtime.py "$RUNNER_TEMP/xray-test/xray"
